    <rect x="-9" y="-4" width="18" height="7" fill="#3A6A0A"/>
    <rect x="-9" y="26" width="18" height="7" fill="#3A6A0A"/>
    <!-- Grip wrap -->
    <rect x="-10" y="38" width="20" height="18" rx="4" fill="#5C3A1E"/>
    <rect x="-10" y="41" width="20" height="2" fill="#3A230F"/>
    <rect x="-10" y="46" width="20" height="2" fill="#3A230F"/>
    <rect x="-10" y="51" width="20" height="2" fill="#3A230F"/>
